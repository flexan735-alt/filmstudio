name: Build FilmStudio JAR

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP (if present)
        shell: bash
        run: |
          archive=$(find . -maxdepth 2 -type f -iname 'FilmStudio-1.21.11-source.zip' -print -quit)
          if [ -n "$archive" ]; then
            unzip -o "$archive" -d extracted-source
          fi

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          project_dir=$(find . -type f -name build.gradle -not -path '*/.gradle/*' -print -quit | xargs dirname)
          if [ -z "$project_dir" ] || [ ! -f "$project_dir/gradlew" ]; then
            echo "No Gradle project found. Upload the contents of FilmStudio-1.21.11-source.zip (or the ZIP itself) to the repository root."
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod JAR
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: FilmStudio-1.21.11-JAR
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
